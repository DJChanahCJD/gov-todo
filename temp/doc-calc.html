<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>数字阅读与公文计算助手</title>
    <style>
      :root {
        --primary: #0066cc;
        --border: #e5e5e5;
        --bg-hover: #f0f7ff;
        --bg-copied: #dff6dd;
      }
      * {
        box-sizing: border-box;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei",
          sans-serif;
        background: #f5f5f5;
        margin: 0;
        padding: 40px 20px;
      }
      .container {
        max-width: 720px;
        margin: auto;
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
      }
      h2 {
        margin: 0;
        font-size: 24px;
        color: #222;
      }
      select,
      input {
        font-size: 16px;
        border: 1px solid #ccc;
        border-radius: 8px;
        outline: none;
        transition: border-color 0.2s;
      }
      select {
        padding: 6px 10px;
      }
      input {
        width: 100%;
        padding: 14px;
        font-size: 18px;
      }
      input:focus {
        border-color: var(--primary);
      }
      .section-title {
        font-size: 13px;
        font-weight: 600;
        color: #666;
        margin: 20px 0 8px 2px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 10px;
      }
      .card {
        background: #fff;
        border-radius: 8px;
        padding: 12px 16px;
        cursor: pointer;
        border: 1px solid var(--border);
        transition: all 0.15s;
      }
      .card:hover {
        background: var(--bg-hover);
        border-color: #b8d8ff;
      }
      .card.copied {
        background: var(--bg-copied);
        border-color: #97e090;
      }
      .card.full {
        grid-column: 1 / -1;
      }
      .label {
        font-size: 12px;
        color: #777;
      }
      .value {
        margin-top: 4px;
        font-size: 20px;
        font-weight: 600;
        color: #111;
        word-break: break-all;
      }
      .tip {
        color: #888;
        font-size: 13px;
        margin-top: 16px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h2>数字阅读与公文计算助手</h2>
        <label
          >精度
          <select id="digits">
            <option>0</option>
            <option>1</option>
            <option selected>2</option>
            <option>3</option>
            <option>4</option>
            <option>5</option>
            <option>6</option>
          </select></label
        >
      </div>
      <input
        id="input"
        placeholder="粘贴单数或对比段落（如：本期150.5万元，去年同期120.2万元）"
        autocomplete="off"
        autofocus
      />
      <div id="result"></div>
      <div class="tip">💡 点击任意计算结果即可一键复制纯文本</div>
    </div>

    <script>
      const input = document.getElementById("input");
      const digits = document.getElementById("digits");
      const result = document.getElementById("result");
      const UNITS = { 万: 1e4, 亿: 1e8, 万亿: 1e12 };

      // 统一事件监听
      [input, digits].forEach((el) => el.addEventListener("input", render));

      // 统一数值格式化
      const format = (n, maxDec = +digits.value, minDec = maxDec) =>
        Number(n).toLocaleString("zh-CN", {
          minimumFractionDigits: minDec,
          maximumFractionDigits: maxDec,
        });

      const toPure = (n) => Number(n).toFixed(+digits.value);

      // 人民币大写转换（分组算法，正确处理零位）
      function toRMB(n) {
        if (isNaN(n) || Math.abs(n) >= 1e12) return "数值超限";
        if (n === 0) return "零元整";

        const cnDigits = "零壹贰叁肆伍陆柒捌玖";
        const units = ["", "拾", "佰", "仟"];
        const bigUnits = ["", "万", "亿"];
        const isNeg = n < 0;
        n = Math.abs(n);

        const [intStr, decStr] = n.toFixed(2).split(".");

        // 从右往左每4位一组（个/万/亿）
        const groups = [];
        for (let i = intStr.length; i > 0; i -= 4) {
          groups.unshift(intStr.slice(Math.max(0, i - 4), i));
        }

        let result = "";
        let needZero = false;

        for (let g = 0; g < groups.length; g++) {
          const seg = groups[g];
          let segStr = "";
          let segNeedZero = false;

          for (let i = 0; i < seg.length; i++) {
            const d = +seg[i];
            const pos = seg.length - 1 - i; // 0=个位, 1=拾, 2=佰, 3=仟
            if (d === 0) {
              segNeedZero = true;
            } else {
              if (segNeedZero) {
                segStr += "零";
                segNeedZero = false;
              }
              segStr += cnDigits[d] + units[pos];
            }
          }

          const bigIdx = groups.length - 1 - g;
          if (segStr) {
            if (needZero && !segStr.startsWith("零")) result += "零";
            result += segStr + bigUnits[bigIdx];
            needZero = false;
          } else if (result) {
            needZero = true;
          }
        }

        if (!result) result = "零";
        result += "元";

        const jiao = +decStr[0],
          fen = +decStr[1];
        if (jiao === 0 && fen === 0) {
          result += "整";
        } else {
          if (jiao > 0) result += cnDigits[jiao] + "角";
          if (fen > 0) result += cnDigits[fen] + "分";
        }

        return (isNeg ? "欠" : "") + result;
      }

      // 渲染卡片组件
      const createCard = ({ title, text, full, show = true }) =>
        show
          ? `
  <div class="card ${full ? "full" : ""}" onclick="copy(this, '${String(text).replace(/'/g, "&#39;")}')">
    <div class="label">${title}</div>
    <div class="value">${text}</div>
  </div>`
          : "";

      function render() {
        const val = input.value.trim();
        if (!val) return (result.innerHTML = "");

        // 匹配文本中的有效数字及中文单位
        const nums = [
          ...val.matchAll(/(-?\d+(?:\.\d+)?)\s*(万亿|万|亿)?\s*(%|‰)?/g),
        ].map((m) => {
          let v = Number(m[1]) * (UNITS[m[2]] || 1);
          if (m[3] === "%") v /= 100;
          if (m[3] === "‰") v /= 1000;
          return v;
        });

        if (!nums.length) return (result.innerHTML = "");

        const [a, b] = nums;
        let html = "";

        // 多数对比分析模式
        if (nums.length >= 2) {
          const diff = a - b,
            rate = b ? (diff / b) * 100 : 0;
          html +=
            `<div class="section-title">📊 双数对比分析（自动识别前两数：${a} 与 ${b}）</div><div class="grid">` +
            [
              {
                title: "增长率 (同比/环比)",
                text: `${rate > 0 ? "+" : ""}${toPure(rate)}%`,
              },
              {
                title: "增长量 (差值)",
                text: `${diff > 0 ? "+" : ""}${toPure(diff)}`,
              },
              {
                title: "占比 (A占B)",
                text: `${toPure(b ? (a / b) * 100 : 0)}%`,
              },
              {
                title: "倍数 (A是B的多少倍)",
                text: `${toPure(b ? a / b : 0)} 倍`,
              },
            ]
              .map(createCard)
              .join("") +
            `</div>`;
        }

        // 基础转换与公文格式
        html +=
          `<div class="section-title">🏢 基础格式与财务转换（当前主数：${a}）</div><div class="grid">` +
          [
            { title: "标准千分位", text: format(a, 20, 0) },
            { title: "纯数字", text: toPure(a) },
            { title: "公文大写金额", text: toRMB(a), full: true },
            {
              title: "万元",
              text: `${format(a / 1e4)} 万元`,
              show: Math.abs(a) >= 100,
            },
            {
              title: "亿元",
              text: `${format(a / 1e8)} 亿元`,
              show: Math.abs(a) >= 1e6,
            },
            {
              title: "万亿元",
              text: `${format(a / 1e12)} 万亿元`,
              show: Math.abs(a) >= 1e10,
            },
            {
              title: "百分比 (%)",
              text: `${toPure(a * 100)}%`,
              show: Math.abs(a) <= 100,
            },
            {
              title: "千分比 (‰)",
              text: `${toPure(a * 1000)}‰`,
              show: Math.abs(a) <= 10,
            },
          ]
            .map(createCard)
            .join("") +
          `</div>`;

        result.innerHTML = html;
      }

      // 复制交互提示
      function copy(el, text) {
        navigator.clipboard.writeText(text);
        el.classList.add("copied");
        setTimeout(() => el.classList.remove("copied"), 500);
      }
    </script>
  </body>
</html>
